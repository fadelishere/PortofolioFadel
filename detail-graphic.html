    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { darkBg: '#05050a', primary: '#00f2fe', secondary: '#4facfe' } } }

    <style>
        .liquid-glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glow-text { text-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }

        /* --- CSS BUTTON ANIMATION --- */
        .btn-wrapper {
          --dot-size: 6px;
          --line-weight: 1px;
          --line-distance: 0.9rem 1.1rem;
          --animation-speed: 0.35s;
          --dot-color: #00f2fe; /* Warna biru sesuai tema */
          --line-color: rgba(0, 242, 254, 0.4);

          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          width: auto;
          height: auto;
          padding: var(--line-distance);
          background-color: #0000;
          transition: background-color 0.3s ease-in-out;
          user-select: none;
        }

        .btn-wrapper:has(.btn:hover) {
          animation: backround-color-change calc(var(--animation-speed) * 4) ease-in-out forwards;
        }
        @keyframes backround-color-change {
          80% { background-color: #0000; }
          100% { background-color: rgba(0, 242, 254, 0.15); } /* #00f2fe versi transparan */
        }

        .btn {
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 0.8rem 1.25rem;
          background-color: #00f2fe; /* Warna biru primary */
          background-image: linear-gradient(#0000, #0004);
          border: none;
          text-decoration: none;

          color: #05050a; /* Teks gelap */
          font-family: 'Poppins', sans-serif;
          font-size: 1rem;
          font-weight: 600;
          text-transform: capitalize;

          border-radius: 30% / 200%;
          cursor: pointer;

          box-shadow:
            0 0 0px 1px rgba(0,0,0,0.3),
            0px 1px 1px rgba(3, 7, 18, 0.02),
            0px 5px 4px rgba(3, 7, 18, 0.04),
            0px 12px 9px rgba(3, 7, 18, 0.06),
            0px 20px 15px rgba(3, 7, 18, 0.08),
            0px 32px 24px rgba(3, 7, 18, 0.1);

          transition:
            background-color 0.2s ease-in-out,
            transform 0.2s ease-in-out,
            box-shadow 0.2s ease-in-out,
            border-radius 0.3s ease-in-out,
            border-color 0.2s ease-in-out;
        }

        .btn:hover {
          background-color: #fff;
          transform: scale(1.05);
          border-radius: 10% / 200%;
        }
        .btn:active {
          background-color: #00f2fe;
          transform: scale(0.98);
          border-radius: 20% / 200%;
        }

        .btn-svg {
          margin-left: 0.5rem;
          height: 24px;
          stroke-width: 1;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke: #05050a;
          fill: rgba(255, 255, 255, 0.7);
          transition: all 0.3s ease-in-out;
        }

        .btn:hover .btn-svg {
          stroke: #05050a;
          fill: #00f2fe; /* Warna isi ikon saat di-hover (biru) */
        }
        .btn:active .btn-svg {
          stroke: #05050a;
          fill: #4facfe; /* Warna isi ikon sekunder */
        }

        /* Dots */
        .dot {
          position: absolute;
          width: var(--dot-size);
          aspect-ratio: 1;
          border-radius: 50%;
          background-color: var(--dot-color);
          transition: all 0.3s ease-in-out;
          opacity: 0;
        }

        .btn-wrapper:has(.btn:hover) .dot.top.left {
          top: 50%; left: 20%;
          animation: move-top-left var(--animation-speed) ease-in-out forwards;
        }
        @keyframes move-top-left {
          90% { opacity: 0.6; }
          100% { top: calc(var(--dot-size) * -0.5); left: calc(var(--dot-size) * -0.5); opacity: 1; }
        }
        .btn-wrapper:has(.btn:hover) .dot.top.right {
          top: 50%; right: 20%;
          animation: move-top-right var(--animation-speed) ease-in-out forwards;
          animation-delay: calc(var(--animation-speed) * 0.6);
        }
        @keyframes move-top-right {
          80% { opacity: 0.6; }
          100% { top: calc(var(--dot-size) * -0.5); right: calc(var(--dot-size) * -0.5); opacity: 1; }
        }
        .btn-wrapper:has(.btn:hover) .dot.bottom.right {
          bottom: 50%; right: 20%;
          animation: move-bottom-right var(--animation-speed) ease-in-out forwards;
          animation-delay: calc(var(--animation-speed) * 1.2);
        }
        @keyframes move-bottom-right {
          80% { opacity: 0.6; }
          100% { bottom: calc(var(--dot-size) * -0.5); right: calc(var(--dot-size) * -0.5); opacity: 1; }
        }
        .btn-wrapper:has(.btn:hover) .dot.bottom.left {
          bottom: 50%; left: 20%;
          animation: move-bottom-left var(--animation-speed) ease-in-out forwards;
          animation-delay: calc(var(--animation-speed) * 1.8);
        }
        @keyframes move-bottom-left {
          80% { opacity: 0.6; }
          100% { bottom: calc(var(--dot-size) * -0.5); left: calc(var(--dot-size) * -0.5); opacity: 1; }
        }

        /* Lines */
        .line {
          position: absolute;
          transition: all 0.3s ease-in-out;
        }
        .line.horizontal {
          height: var(--line-weight);
          width: 100%;
          background-image: repeating-linear-gradient(90deg, #0000 0 calc(var(--line-weight) * 2), var(--line-color) calc(var(--line-weight) * 2) calc(var(--line-weight) * 4));
        }
        .line.top { top: calc(var(--line-weight) * -0.5); }
        .line.bottom { bottom: calc(var(--line-weight) * -0.5); }
        
        .line.vertical {
          width: var(--line-weight);
          height: 100%;
          background-image: repeating-linear-gradient(0deg, #0000 0 calc(var(--line-weight) * 2), var(--line-color) calc(var(--line-weight) * 2) calc(var(--line-weight) * 4));
        }
        .line.left { left: calc(var(--line-weight) * -0.5); }
        .line.right { right: calc(var(--line-weight) * -0.5); }

        .line.top { transform-origin: top left; transform: rotate(5deg) scaleX(0); }
        .btn-wrapper:has(.btn:hover) .line.top {
          animation: draw-top var(--animation-speed) ease-in-out forwards;
          animation-delay: calc(var(--animation-speed) * 0.8);
        }
        @keyframes draw-top { 100% { transform: rotate(0deg) scaleX(1); } }
        
        .line.bottom { transform-origin: bottom right; transform: rotate(5deg) scaleX(0); }
        .btn-wrapper:has(.btn:hover) .line.bottom {
          animation: draw-bottom var(--animation-speed) ease-in-out forwards;
          animation-delay: calc(var(--animation-speed) * 2);
        }
        @keyframes draw-bottom { 100% { transform: rotate(0deg) scaleX(1); } }

        .line.left { transform-origin: bottom left; transform: rotate(0deg) scaleY(0); }
        .btn-wrapper:has(.btn:hover) .line.left {
          animation: draw-left var(--animation-speed) ease-in-out forwards;
          animation-delay: calc(var(--animation-speed) * 2.4);
        }
        @keyframes draw-left { 100% { transform: rotate(0deg) scaleY(1); } }

        .line.right { transform-origin: top right; transform: rotate(5deg) scaleY(0); }
        .btn-wrapper:has(.btn:hover) .line.right {
          animation: draw-right var(--animation-speed) ease-in-out forwards;
          animation-delay: calc(var(--animation-speed) * 1.4);
        }
        @keyframes draw-right { 100% { transform: rotate(0deg) scaleY(1); } }
    </style>
</head>
